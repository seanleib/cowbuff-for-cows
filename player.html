<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#1d2b1a;color:#fff;overflow:hidden;height:100vh}
#side{position:absolute;left:0;top:0;bottom:0;width:150px;z-index:5;background:#2a5a1a;display:flex;flex-direction:column;gap:6px;padding:12px 8px}
#side button{padding:12px;border:0;border-radius:10px;font-size:16px;cursor:pointer;background:#bff08a;color:#2a5a1a}
#side button.on{background:#ffd23f;font-weight:bold}
#menu{position:absolute;inset:0;padding:24px 24px 24px 174px;overflow:auto;background:linear-gradient(#9fe0ff,#bff08a)}
#menu h1{color:#2a5a1a;text-align:center;font-size:44px;margin:8px}
#menu p{color:#2a5a1a;text-align:center;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;max-width:1000px;margin:auto}
.ep{background:#fff;color:#2a5a1a;border:0;border-radius:14px;padding:14px;font-size:16px;text-align:left;cursor:pointer;box-shadow:0 3px 0 #0003}
.ep b{display:block;font-size:13px;color:#c07000}
.ep.soon{opacity:.55;cursor:default}
#stage{position:absolute;inset:0;display:none;overflow:hidden;transition:background 2s}
#sun{position:absolute;top:6%;left:70%;width:90px;height:90px;border-radius:50%;background:#ffe14d;box-shadow:0 0 50px #fff6;transition:all 3s}
.cloud{position:absolute;width:120px;height:40px;background:#fff;border-radius:40px;opacity:.9;animation:drift 60s linear infinite}
@keyframes drift{from{left:-150px}to{left:110%}}
#ground{position:absolute;left:0;right:0;bottom:0;height:38%;background:#58b83a;transition:background 2s}
#cow{position:absolute;bottom:18%;left:10%;width:260px;transition:left 6s ease-in-out}
#cow svg{width:100%;overflow:visible}
#cow.munch #head{animation:munch .6s infinite}
#cow.walk #body{animation:hop .7s infinite}
#cow.sleep #head{transform:rotate(25deg) translateY(15px)}
#cow.dance #body{animation:hop .35s infinite}
@keyframes munch{50%{transform:translateY(12px) rotate(8deg)}}
@keyframes hop{50%{transform:translateY(-8px)}}
#head{transform-origin:200px 90px;transition:transform 1s}
.fl{position:absolute;font-size:30px;animation:fly 5s ease-in-out infinite}
@keyframes fly{50%{transform:translate(60px,-40px)}}
#sub{position:absolute;bottom:4%;left:0;right:0;text-align:center;font-size:28px;text-shadow:0 2px 4px #000}
#sub i{display:block;font-size:20px;color:#ffe9a0}
#bar{position:absolute;top:0;left:0;height:8px;background:#ffd23f;width:0}
#ctl{position:absolute;top:12px;right:12px;display:flex;gap:8px}
#ctl button{padding:8px 14px;font-size:16px;border-radius:10px;border:0;cursor:pointer}
#title{position:absolute;top:12px;left:16px;font-size:20px;text-shadow:0 2px 3px #000}
